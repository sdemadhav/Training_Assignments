<div class="loan-container">
    <h2>Loan EMI Calculator</h2>
  
    <label for="applicantName">Applicant Name:</label>
    <input type="text" id="applicantName" [(ngModel)]="applicantName" (input)="onInputChange()" />
  
    <label for="loanType">Type of Loan:</label>
    <select id="loanType" [(ngModel)]="loanType" (change)="onLoanTypeChange()">
      <option value="" disabled selected>Select Loan Type</option>
      <option *ngFor="let type of getLoanTypes()" [value]="type">{{ type }}</option>
    </select>
  
            <label for="interestRate">Interest Rate:</label>
    <input type="text" id="interestRate" [(ngModel)]="interestRate" readonly />
  
    <label for="amount">Loan Amount:</label>
    <input type="number" id="amount" [(ngModel)]="amount" (input)="onInputChange()" />
  
    <label for="tenure">Tenure (Years):</label>
    <input type="number" id="tenure" [(ngModel)]="tenure" (input)="onInputChange()" />
  
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  
    <div *ngIf="emi !== null">
      <h3>Loan EMI: {{ emi | currency:'INR' }}</h3>
    </div>
</div>
