<div class="mutual-funds-container">
    <h2>Mutual Funds Calculator</h2>
  
    <label for="applicantName">Applicant Name:</label>
    <input type="text" id="applicantName" [(ngModel)]="applicantName" (input)="onInputChange()" />

    <label for="amount">Monthly SIP amount:</label>
    <input type="number" id="monthly_sip" [(ngModel)]="monthly_sip" (input)="onInputChange()" />

    <label for="tenure">Duration (Years):</label>
    <input type="number" id="tenure" [(ngModel)]="tenure" (input)="onInputChange()" />
  
    <label for="interestRate">Interest Rate:</label>
    <input type="text" id="interestRate" [(ngModel)]="interestRate" (input)="onInputChange()" />

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  
    <div *ngIf="totalValue !== null">
      <h3>Total Investment: {{ totalInvestment | currency:'INR' }}</h3>
      <h3>Interest Earned : {{ interestEarned | currency:'INR' }}</h3>
      <h3>Total Value     : {{ totalValue | currency:'INR' }}</h3>
    </div>
  </div>
