<!DOCTYPE html>
<html lang="en">
<head>

            alert("Hello " + fname + " " + lname+"from greetUser1");
        }

            var fname = document.getElementsByName("t1")[0].value;
            var lname = document.getElementsByName("t2")[0].value;
            alert("Hello " + fname + " " + lname+"from greetUser2");
        }

        function greetUser3() {
            var fname = document.getElementById("i1").value;
            var lname = document.getElementById("i2").value;            
            alert("Hello " + fname + " " + lname+"from greetUser3");
        }

        function greetUser4(){
            var fname = document.forms[0].t1.value;
            var lname = document.forms[0].t2.value;
            alert("Hello " + fname + " " + lname+"from greetUser4");
        }

        function greetUser5(){
            var fname = document.f1.t1.value;
            var lname = document.f1.t2.value;
            alert("Hello " + fname + " " + lname+"from greetUser5");
        }
    </script>
</head>
<body>
    <h1>DOM Demo</h1>
    <hr>
    <h2>Greet User</h2>

        <input type="button" value="Submit 3" onclick="greetUser3()">

</form>
</body>
</html>
