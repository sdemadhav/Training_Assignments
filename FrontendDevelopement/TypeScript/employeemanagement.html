<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
            margin: 20px;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #28a745;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .table-container {
            margin-top: 20px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        .update-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .update-btn:hover {
            background-color: #0056b3;
        }
        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Employee Management</h2>
        <input type="text" id="empName" placeholder="Employee Name">
        <select id="empRole">
            <option value="Clerk">Clerk</option>
            <option value="Programmer">Programmer</option>
            <option value="Manager">Manager</option>
        </select>
        <input type="number" id="empSalary" placeholder="Salary">
        <button onclick="addEmployee()">Add Employee</button>
        
        <div style="display: flex; justify-content: space-between; margin-top: 20px;">
            <input type="text" id="searchBox" placeholder="Find Employee" onkeyup="searchEmployee()" style="width: 70%;">
            <select id="searchBy" style="width: 28%;">
                <option value="id">ID</option>
                <option value="name">Name</option>
                <option value="role">Designation</option>
            </select>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Designation</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        let employees = [];
        let idCounter = 1;

        function addEmployee() {
            let name = document.getElementById('empName').value;
            let role = document.getElementById('empRole').value;
            let salary = document.getElementById('empSalary').value;
            if (name && salary) {
                employees.push({ id: idCounter++, name, role, salary: parseFloat(salary) });
                document.getElementById('empName').value = '';
                document.getElementById('empSalary').value = '';
                renderEmployees();
            }
        }

        function deleteEmployee(id) {
            employees = employees.filter(emp => emp.id !== id);
            renderEmployees();
        }

        function updateEmployee(id) {
            let newSalary = prompt("Enter new salary:");
            if (newSalary) {
                employees = employees.map(emp => emp.id === id ? { ...emp, salary: parseFloat(newSalary) } : emp);
                renderEmployees();
            }
        }

        function searchEmployee() {
            let query = document.getElementById('searchBox').value.toLowerCase();
            let searchBy = document.getElementById('searchBy').value;
            let filteredEmployees = employees.filter(emp => 
                searchBy === 'id' ? emp.id.toString().includes(query) : 
                searchBy === 'name' ? emp.name.toLowerCase().includes(query) :
                emp.role.toLowerCase().includes(query)
            );
            renderEmployees(filteredEmployees);
        }

        function renderEmployees(filteredList = employees) {
            let tableBody = document.getElementById('employeeTable');
            tableBody.innerHTML = '';
            filteredList.forEach(emp => {
                let row = `<tr>
                    <td>${emp.id}</td>
                    <td>${emp.name}</td>
                    <td>${emp.role}</td>
                    <td>$${emp.salary}</td>
                    <td>
                        <button class='update-btn' onclick='updateEmployee(${emp.id})'>Update</button>
                        <button class='delete-btn' onclick='deleteEmployee(${emp.id})'>Delete</button>
                    </td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        }
    </script>
</body>
</html>
